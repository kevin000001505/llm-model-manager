networks:
  llama-net:
    # A fixed name: radiance containers join it, and llama-swap reaches them by container name.
    name: ${LLAMA_NET:-llm-llama-net}

services:
  llm-model-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/llm-model-manager:latest
    container_name: llm-model-manager
    restart: unless-stopped
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - GPUS=${GPUS:-}
      # - LOG_LEVEL=DEBUG # Uncomment for verbose logging
    ports:
      - "8000:8000"
    volumes:
      - ${MODELS}:/models
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8000"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  llama-swap:
    build:
      context: .
      dockerfile: ${LLAMA_DOCKERFILE:-Dockerfile.llama.cuda}
      args:
        # Single source of truth for the llama.cpp version across all backends.
        # Bump here (or override in .env) to rebuild against a newer commit;
        # changing it busts the cached git-clone layer. d2462f8f (2026-06-09) has
        # MTP support (PR #22673) + fixes. NOTE: do NOT advance to the next commit
        # e95dae18 (#24086) — it regresses loading of dense non-MTP qwen35 models
        # (e.g. plain Qwen3.6-27B). Bisect-verified; re-check when bumping.
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-d2462f8f7ac6d80070a587ffebf6cd73730f4280}
    image: local/llama-swap:${LLAMA_BACKEND:-cuda}
    container_name: llama-swap
    restart: unless-stopped
    ports:
      - 8080:8080
    networks:
      - llama-net
    volumes:
      - ${MODELS}:/models
    # -watch-config: llm-model-manager rewrites config.yaml at startup too, possibly after
    # llama-swap has read it; reload on change instead of serving the stale copy.
    command: --config /models/served/config.yaml -watch-config